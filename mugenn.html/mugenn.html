<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>えいえんトンネル</title>

<style>
  body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  /* 無限空間 */
  .section {
    height: 100vh;
  }

  /* ボタン */
  #actionBtn {
    position: fixed;
    padding: 14px 32px;
    font-size: 16px;
    background: #e63946;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }

  /* コメント */
  #comment {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 20;
    text-align: center;
  }

  #comment.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
</style>
</head>
<body>

<button id="actionBtn">押せ</button>
<div id="comment"></div>
<div id="tunnel"></div>

<script>
  const tunnel = document.getElementById("tunnel");
  const btn = document.getElementById("actionBtn");
  const comment = document.getElementById("comment");

  let count = 0;
  let shown = false;

  const messages = [
    "まだ終わらない",
    "戻れない",
    "進んだ気がした？",
    "同じ場所だ",
    "出口はない",
    "よく押したな"
  ];

  /* ===== 無限セクション生成 ===== */
  function addSection() {
    const sec = document.createElement("div");
    sec.className = "section";
    tunnel.appendChild(sec);
  }

  // 初期生成
  for (let i = 0; i < 4; i++) addSection();

  /* ===== ボタン位置ランダム ===== */
  function randomizeButtonPosition() {
    const w = btn.offsetWidth;
    const h = btn.offsetHeight;

    const x = Math.random() * (window.innerWidth - w);
    const y = Math.random() * (window.innerHeight - h);

    btn.style.left = x + "px";
    btn.style.top = y + "px";
  }

  /* ===== スクロール監視 ===== */
  window.addEventListener("scroll", () => {
    const scrollBottom = window.scrollY + window.innerHeight;
    const pageHeight = document.body.offsetHeight;

    // 下に来たら無限追加
    if (pageHeight - scrollBottom < 600) {
      addSection();
    }

    // ランダムでボタン出現
    if (!shown && Math.random() < 0.005) {
      randomizeButtonPosition();
      btn.style.display = "block";
      shown = true;
    }
  });

  /* ===== ボタン押下 ===== */
  btn.addEventListener("click", () => {
    count++;
    btn.style.display = "none";

    if (Math.random() < 0.5) {
      comment.textContent =
        messages[Math.floor(Math.random() * messages.length)];
    } else {
      comment.textContent = `押した回数：${count}`;
    }

    comment.classList.add("show");

    setTimeout(() => {
      comment.classList.remove("show");
      shown = false;
    }, 2000);
  });
</script>

</body>
</html>
