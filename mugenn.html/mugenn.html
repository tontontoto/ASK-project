<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>えいえんサイト</title>

<style>
  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  .section {
    height: 100vh;
  }

  button {
    position: absolute;
    padding: 14px 28px;
    font-size: 14px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.5;
    text-align: center;
  }

  #comment {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 20;
    text-align: center;
  }

  #comment.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
</style>
</head>
<body>

<div id="comment"></div>
<div id="tunnel"></div>

<script>
  const tunnel = document.getElementById("tunnel");
  const comment = document.getElementById("comment");

  let currentBtn = null;
  let baseScroll = 0;
  let baseTop = 0;

  let pressCount = 0;
  let lastKnownKm = 0;

  const taunts = [
    "押さなくていいよ",
    "どうせ進むだけ",
    "それ意味ある？",
    "戻れないけど",
    "見てるだけ？",
    "まだやるの？",
    "通り過ぎるんだ",
    "ここ押す？"
  ];

  function addSection() {
    const sec = document.createElement("div");
    sec.className = "section";
    tunnel.appendChild(sec);
  }

  for (let i = 0; i < 6; i++) addSection();

  function kmNow() {
    return scrollY / 1000;
  }

  function showComment(text, time = 2200) {
    comment.innerHTML = text;
    comment.classList.add("show");
    setTimeout(() => comment.classList.remove("show"), time);
  }

  function spawnButton() {
    if (currentBtn) return;

    const btn = document.createElement("button");

    const types = ["distance", "record", "progress", "taunt"];
    btn.dataset.type = types[Math.floor(Math.random() * types.length)];

    setButtonLabel(btn);

    btn.style.left =
      Math.random() * (innerWidth - 200) + "px";
    btn.style.top =
      scrollY + innerHeight * 0.6 + "px";

    tunnel.appendChild(btn);

    baseScroll = scrollY;
    baseTop = btn.offsetTop;

    btn.onclick = () => handleClick(btn);

    currentBtn = btn;
  }

  function setButtonLabel(btn) {
    if (btn.dataset.type === "distance") {
      btn.innerHTML = "押せ！！";
    }
    if (btn.dataset.type === "record") {
      btn.innerHTML = "押せ！！";
    }
    if (btn.dataset.type === "progress") {
      btn.innerHTML = "";
    }
    if (btn.dataset.type === "taunt") {
      btn.innerHTML = taunts[Math.floor(Math.random() * taunts.length)];
    }
  }

  function handleClick(btn) {
    pressCount++;
    lastKnownKm = kmNow();

    if (btn.dataset.type === "distance") {
      showComment(`${lastKnownKm.toFixed(1)} km 進んだ`);
    }

    if (btn.dataset.type === "record") {
      showComment(
        `ボタンを ${pressCount} 回押した<br>` +
        `進んだ距離：${lastKnownKm.toFixed(1)} km`
      );
    }

    if (btn.dataset.type === "progress") {
      showComment(
        `たぶん<br>${lastKnownKm.toFixed(1)} km<br>くらい`
      );
    }

    if (btn.dataset.type === "taunt") {
      showComment(
        taunts[Math.floor(Math.random() * taunts.length)]
      );
    }

    btn.remove();
    currentBtn = null;
  }

  window.addEventListener("scroll", () => {
    const bottom = scrollY + innerHeight;
    const height = document.body.offsetHeight;

    if (height - bottom < 600) addSection();

    if (!currentBtn && Math.random() < 0.025) {
      spawnButton();
    }

    if (currentBtn) {
      const diff = scrollY - baseScroll;
      const follow = diff < 120 ? diff * 0.6 : 120 * 0.6;
      currentBtn.style.top = baseTop + follow + "px";
    }
  });
</script>

</body>
</html>
