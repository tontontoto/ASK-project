<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>えいえんサイト</title>

<style>
  body {
    margin: 0;
    background: #fff;
    color: #000;
    font-family: sans-serif;
    overflow-x: hidden;
  }

  .section {
    height: 100vh;
  }

  /* ボタン */
  button {
    position: fixed;
    padding: 20px 50px;
    font-size: 15px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: none;
    z-index: 10;
    white-space: nowrap;
    transition: opacity .3s;
  }

  /* 距離表示 */
  #distance {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: .08em;
    z-index: 30;
  }

  /* コメント */
  #comment {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s, transform .3s;
    z-index: 20;
    text-align: center;
  }

  #comment.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.05);
  }
</style>
</head>
<body>

<div id="distance">進行距離：0m</div>

<button id="actionBtn"></button>
<button id="growBtn">遠くする</button>
<button id="shrinkBtn">短くする</button>

<div id="comment"></div>
<div id="tunnel"></div>

<script>
  const tunnel = document.getElementById("tunnel");
  const comment = document.getElementById("comment");
  const distanceEl = document.getElementById("distance");

  const buttons = [
    document.getElementById("actionBtn"),
    document.getElementById("growBtn"),
    document.getElementById("shrinkBtn")
  ];

  let currentBtn = null;
  let btnAppearScroll = 0;
  let count = 0;

  const messages = [
    "まだ終わらない",
    "戻れない",
    "進んだ気がした？",
    "同じ場所だ",
    "出口はない",
    "よく押したな"
  ];

  /* セクション */
  function addSection() {
    const sec = document.createElement("div");
    sec.className = "section";
    tunnel.appendChild(sec);
  }

  for (let i = 0; i < 4; i++) addSection();

  /* ランダム位置 */
  function randomPos(btn) {
    btn.style.left =
      Math.random() * (innerWidth - btn.offsetWidth) + "px";
    btn.style.top =
      Math.random() * (innerHeight - btn.offsetHeight) + "px";
  }

  function showComment(text, time = 1800) {
    comment.textContent = text;
    comment.classList.add("show");
    setTimeout(() => comment.classList.remove("show"), time);
  }

  /* ボタン出現 */
  function showRandomButton() {
    if (currentBtn) return;

    const btn = buttons[Math.floor(Math.random() * buttons.length)];
    randomPos(btn);

    btn.style.display = "block";
    btn.style.opacity = 1;
    btn.style.transform = "translateY(0)";

    btnAppearScroll = scrollY;
    currentBtn = btn;
  }

  /* スクロール処理 */
  window.addEventListener("scroll", () => {
    const bottom = scrollY + innerHeight;
    const height = document.body.offsetHeight;

    distanceEl.textContent = `進行距離：${Math.floor(scrollY)}m`;

    if (height - bottom < 600) addSection();

    if (!currentBtn && Math.random() < 0.02) {
      showRandomButton();
    }

    /* ボタン追従 → 消失 */
    if (currentBtn) {
      const diff = scrollY - btnAppearScroll;

      let follow;
      if (diff < 120) {
        follow = diff * 0.9;
      } else {
        follow = 120 * 0.9 - (diff - 120) * 0.5;
      }

      currentBtn.style.transform = `translateY(${follow}px)`;
      currentBtn.style.opacity = Math.max(1 - diff / 260, 0);

      if (diff > 300) {
        currentBtn.style.display = "none";
        currentBtn = null;
      }
    }
  });

  /* 押せ */
  document.getElementById("actionBtn").onclick = () => {
    count++;
    currentBtn.style.display = "none";
    currentBtn = null;

    showComment(
      Math.random() < 0.5
        ? messages[Math.floor(Math.random() * messages.length)]
        : `押した回数：${count}`
    );
  };

  /* 長くする */
  document.getElementById("growBtn").onclick = () => {
    currentBtn.style.display = "none";
    currentBtn = null;

    const n = Math.floor(Math.random() * 3) + 1;
    for (let i = 0; i < n; i++) addSection();

    showComment("遠くなったーー");
  };

  /* 短くする */
  document.getElementById("shrinkBtn").onclick = () => {
    currentBtn.style.display = "none";
    currentBtn = null;

    const n = Math.floor(Math.random() * 3) + 1;
    for (let i = 0; i < n; i++) {
      if (tunnel.children.length > 2) {
        tunnel.removeChild(tunnel.lastElementChild);
      }
    }

    showComment("近づいたと思った？");
  };
</script>

</body>
</html>
